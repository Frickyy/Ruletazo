# Migraciones de la base (Alembic). Normalmente no hace falta usarlo a mano:
# el backend aplica las migraciones pendientes al arrancar (ver app/db/migrations.py).
# Para crear una nueva después de cambiar un modelo:
#   alembic revision --autogenerate -m "descripcion"
[alembic]
script_location = migrations

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

services:
  app:
    build:
      context: .
      args:
        # La misma URL pública, para la imagen y el link de la vista previa al compartir.
        SITE_URL: ${FRONTEND_URL:-}
    # Solo localhost: desde afuera se entra por el túnel de Cloudflare (o un proxy con HTTPS).
    ports:
      - "127.0.0.1:8000:8000"
    # STEAM_API_KEY, SESSION_SECRET, ADMIN_STEAM_IDS… (ver backend/.env.example)
    env_file: backend/.env
    # Estos pisan lo que diga backend/.env (que está pensado para desarrollo local).
    environment:
      # Adonde vuelve el login de Steam: la URL pública de la app.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8000}
      DATABASE_URL: sqlite:////data/steam_roulette.db
      FRONTEND_DIST: /app/frontend-dist
      ENVIRONMENT: production
      # Una copia de la base por día, en el mismo volumen.
      BACKUP_DIR: /data/backups
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  data:
